<!-- Icône de l'application : la pile de photos de la page d'accueil (.deck, style.css) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221e28"/><stop offset="1" stop-color="#0b0a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".25" r=".8">
      <stop offset="0" stop-color="#f0a95b" stop-opacity=".22"/><stop offset="1" stop-color="#f0a95b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1" x1=".4" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#7fc4d8"/><stop offset=".6" stop-color="#2f6f8f"/><stop offset="1" stop-color="#1d3b4f"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8a"/><stop offset=".5" stop-color="#f08a5d"/><stop offset="1" stop-color="#7a3f6e"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad1a0"/><stop offset=".65" stop-color="#3f8a5c"/><stop offset="1" stop-color="#264d36"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <g id="card"><rect x="147" y="138" width="218" height="236" rx="8" fill="#f6f1e8" filter="url(#shadow)"/></g>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#glow)"/>
  <g transform="rotate(-11 256 256) translate(-55 0)">
    <use href="#card"/><rect x="162" y="153" width="188" height="170" rx="4" fill="url(#p1)"/>
  </g>
  <g transform="rotate(7 256 256) translate(50 0)">
    <use href="#card"/><rect x="162" y="153" width="188" height="170" rx="4" fill="url(#p2)"/>
  </g>
  <g transform="rotate(-1 256 256)">
    <use href="#card"/><rect x="162" y="153" width="188" height="170" rx="4" fill="url(#p3)"/>
    <circle cx="294" cy="204" r="16" fill="#fff3c4"/>
  </g>
</svg>
